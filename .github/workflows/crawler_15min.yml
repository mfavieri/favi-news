name: "FaviNews Crawler (A cada 15 min)"

on:
  workflow_dispatch: # Acionado externamente pelo cron-job.org nos minutos 0, 15, 30, 45 (ou manual com 1 clique)
  repository_dispatch:
    types: [cronjob_giro_15min]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "favinews-crawler-pages"
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "📥 Checkout do Repositório"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Instalar Dependências Leves (Pillow + Google Drive API)"
        run: |
          pip install --upgrade pip
          pip install Pillow google-api-python-client google-auth

      - name: "🎙️ Executar Crawler FaviNews (Gera _R_ e _N_ + Status JSON + Expurgo 72h)"
        env:
          TZ: "America/Sao_Paulo"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python backend/crawler.py

      - name: "💾 Salvar Base de Conhecimento nas Branches"
        run: |
          git config user.name "FaviNews Bot"
          git config user.email "bot@favinews.local"
          git add base_conhecimento/
          if ! git diff --staged --quiet; then
            git commit -m "chore(noticias): giro automatico nuvem GitHub Actions"
            git push origin HEAD:main --force
            git push origin HEAD:frontend --force
            git push origin HEAD:backend --force
          fi

      - name: "🌐 Configurar GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "📦 Empacotar Site e Base de Conhecimento para o Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: "🚀 Publicar Atualização Direto no GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
