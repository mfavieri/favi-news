name: "FaviNews Crawler (A cada 15 min)"

on:
  schedule:
    # Executa automaticamente a cada 15 minutos ("Em 15 minutos tudo pode mudar !!")
    - cron: "*/15 * * * *"
  workflow_dispatch: # Permite disparo manual com 1 clique na aba Actions do GitHub

permissions:
  contents: write

jobs:
  coletar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout do Repositório"
        uses: actions/checkout@v4

      - name: "🐍 Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Instalar Dependências Leves (Pillow + Google Drive API)"
        run: |
          pip install --upgrade pip
          pip install Pillow google-api-python-client google-auth

      - name: "🎙️ Executar Crawler FaviNews (Gera _R_ e _N_ + Expurgo 72h)"
        env:
          TZ: "America/Sao_Paulo"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python backend/crawler.py

      - name: "💾 Atualizar Base de Conhecimento (Janela de 3 Dias)"
        run: |
          git config user.name "FaviNews Bot"
          git config user.email "bot@favinews.local"
          git add base_conhecimento/
          git diff --staged --quiet || git commit -m "chore(noticias): atualizacao automatica 15min [skip ci]"
          git push

